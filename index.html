<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reca Mae's Diceee!</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --pink-deep:  #e91e8c;
      --pink-mid:   #f06292;
      --pink-soft:  #f8bbd0;
      --pink-pale:  #fce4ec;
      --shadow:     rgba(233, 30, 140, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
      font-family: 'Nunito', sans-serif;
      padding: 24px 16px;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: #e91e8c;
      top: -100px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: #ad1457;
      bottom: -100px; right: -100px;
    }

    .card {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 32px;
      padding: 40px 44px 36px;
      text-align: center;
      box-shadow: 0 20px 60px var(--shadow);
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2rem;
      color: var(--pink-deep);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--pink-mid);
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }


    .dice-wrapper {
      display: inline-block;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .dice-wrapper:active .dice { transform: scale(0.92); }

    .dice {
      width: 110px;
      height: 110px;
      background: linear-gradient(145deg, #fff, #fce4ec);
      border: 3px solid var(--pink-mid);
      border-radius: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 12px;
      gap: 5px;
      box-shadow: 0 8px 28px var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .dice-wrapper:hover .dice { box-shadow: 0 14px 40px var(--shadow); }

    .dot { background: var(--pink-deep); border-radius: 50%; }
    .dot.hidden { background: transparent; }

    @keyframes shake {
      0%   { transform: rotate(0deg)   translateX(0); }
      15%  { transform: rotate(-12deg) translateX(-6px); }
      30%  { transform: rotate(10deg)  translateX(6px); }
      45%  { transform: rotate(-8deg)  translateX(-4px); }
      60%  { transform: rotate(7deg)   translateX(4px); }
      75%  { transform: rotate(-4deg)  translateX(-2px); }
      90%  { transform: rotate(3deg)   translateX(2px); }
      100% { transform: rotate(0deg)   translateX(0); }
    }
    .dice.rolling { animation: shake 0.55s ease; }

    .pip-label {
      font-size: 0.78rem;
      color: var(--pink-mid);
      font-weight: 700;
      margin-bottom: 20px;
      min-height: 18px;
      letter-spacing: 0.05em;
    }

    .photo-frame {
      width: 200px;
      height: 200px;
      border-radius: 20px;
      border: 3px solid var(--pink-soft);
      box-shadow: 0 8px 28px var(--shadow);
      overflow: hidden;
      margin: 0 auto 22px;
      background: var(--pink-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-placeholder {
      font-size: 0.85rem;
      color: var(--pink-mid);
      font-weight: 600;
      padding: 10px;
      line-height: 1.5;
    }
    .photo-frame.hidden { display: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeUp 0.4s ease forwards; }


    .result-box {
      background: linear-gradient(135deg, var(--pink-pale), #fce4ec);
      border: 2px solid var(--pink-soft);
      border-radius: 20px;
      padding: 20px 22px;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-name {
      font-family: 'Pacifico', cursive;
      font-size: 1.5rem;
      color: var(--pink-deep);
      margin-bottom: 8px;
      min-height: 1.8rem;
    }
    .result-message {
      font-size: 0.93rem;
      color: #c2185b;
      font-weight: 600;
      line-height: 1.55;
      min-height: 1.2rem;
    }
    .placeholder {
      font-size: 0.92rem;
      color: var(--pink-mid);
      font-weight: 600;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--pink-mid);
      opacity: 0.8;
      letter-spacing: 0.04em;
    }

    /* confetti */
    .confetti-dot {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: confettiFall 0.9s ease forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(110px) rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="card">


  <h1>Reca Mae's Dice!</h1>


  <p class="subtitle">Hi mae, click mo ilalim hehe :D</p>

  
  <div class="dice-wrapper" onclick="rollDice()" title="Click to roll!">
    <div class="dice" id="dice">
      <div class="dot hidden" id="d1"></div>
      <div class="dot hidden" id="d2"></div>
      <div class="dot hidden" id="d3"></div>
      <div class="dot hidden" id="d4"></div>
      <div class="dot hidden" id="d5"></div>
      <div class="dot hidden" id="d6"></div>
      <div class="dot hidden" id="d7"></div>
      <div class="dot hidden" id="d8"></div>
      <div class="dot hidden" id="d9"></div>
    </div>
  </div>
  <p class="pip-label" id="pipLabel"></p>


  <div class="photo-frame hidden" id="photoFrame">
    <img id="photo" src="" alt="photo"/>
  </div>


  <div class="result-box">
    <p class="placeholder" id="placeholder">Click the dice to start ✨</p>
    <p class="result-name"    id="resultName"></p>
    <p class="result-message" id="resultMessage"></p>
  </div>

  <p class="hint">🎀 HOPE U LIKE IT :DDD</p>
</div>

<script>


  const PERSON_NAME = [
    "Reca Mae"
  ]
  const messages = [
    "I want to say that you are a good person always, sana di ka magbago hehe", 
    "Sana maging successful ka, and im sure with it",                                   
    "Im sure you will have all the things you want.",   
    "Mamalasin daw yung mga nang aapi sayo HAHAHAHA",                          
    "Ganda ganda mo always",                         
    "Peak Sigma female i've ever met HAHAHA",
    "pag eto nakuha mo, di ka na mamalasin",
    "pag eto nakuha mo, edi wow",
    "Gym tayo? HAAHAHA",
    "Kape pa? HAHAHAHA"
];

  const images = [
    "wow.jpg",
    "wow2.jpg",
    "wow3.jpg",   
    "wow4.jpg",   
  ];

  const DICE_FACES = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  const CONFETTI_COLORS = ["#e91e8c","#f06292","#ad1457","#ec407a","#c2185b","#f48fb1"];

  let rolling = false;
  let lastMsgIndex = -1;
  let lastImgIndex = -1;

  function showFace(value) {
    const active = DICE_FACES[value];
    for (let i = 1; i <= 9; i++) {
      document.getElementById("d" + i).classList.toggle("hidden", !active.includes(i));
    }
  }


  function pickRandom(arr, lastIndex) {
    if (arr.length === 1) return 0;
    let idx;
    do { idx = Math.floor(Math.random() * arr.length); } while (idx === lastIndex);
    return idx;
  }

  function spawnConfetti(x, y) {
    for (let i = 0; i < 14; i++) {
      const el = document.createElement("div");
      el.className = "confetti-dot";
      const size = 6 + Math.random() * 8;
      el.style.cssText = `
        left: ${x + (Math.random() - 0.5) * 160}px;
        top: ${y + (Math.random() - 0.5) * 80}px;
        width: ${size}px; height: ${size}px;
        background: ${CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]};
        animation-duration: ${0.7 + Math.random() * 0.5}s;
      `;
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }

  function rollDice() {
    if (rolling) return;
    rolling = true;

    // Clear previous result
    document.getElementById("placeholder").style.display = "none";
    document.getElementById("resultName").textContent = "";
    document.getElementById("resultMessage").textContent = "";

    const dice = document.getElementById("dice");
    dice.classList.add("rolling");

  
    const shuffleInterval = setInterval(() => {
      showFace(Math.ceil(Math.random() * 6));
    }, 80);

    setTimeout(() => {
      clearInterval(shuffleInterval);
      dice.classList.remove("rolling");


      const value = Math.ceil(Math.random() * 6);
      showFace(value);
      document.getElementById("pipLabel").textContent = `Rolled a ${value}`;


      const msgIdx = pickRandom(messages, lastMsgIndex);
      lastMsgIndex = msgIdx;

   
      const imgIdx = pickRandom(images, lastImgIndex);
      lastImgIndex = imgIdx;

  
      const nameEl = document.getElementById("resultName");
      const msgEl  = document.getElementById("resultMessage");
      nameEl.textContent = PERSON_NAME;
      msgEl.textContent  = messages[msgIdx];
      nameEl.classList.remove("fade-in"); msgEl.classList.remove("fade-in");
      void nameEl.offsetWidth;
      nameEl.classList.add("fade-in"); msgEl.classList.add("fade-in");


      const frame = document.getElementById("photoFrame");
      const img   = document.getElementById("photo");
      img.src = images[imgIdx];
      frame.classList.remove("hidden");
      frame.classList.remove("fade-in");
      void frame.offsetWidth;
      frame.classList.add("fade-in");


      const rect = dice.getBoundingClientRect();
      spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);

      rolling = false;
    }, 600);
  }
</script>
</body>
</html>
